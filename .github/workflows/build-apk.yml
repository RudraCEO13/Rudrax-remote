name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          java -version 2>&1 | grep -q 'version "17' || (echo "Java version is not 17" && exit 1)

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            keytool -genkeypair -v -keystore ./debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            if [ ! -f ./debug.keystore ]; then
              echo "Failed to create debug keystore"
              exit 1
            fi
            echo "debug.keystore created."
          else
            echo "debug.keystore already exists."
          fi

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "APK exists."
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            echo "APK not found!"
            find app/build/outputs/apk -name "*.apk"
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/app-debug.apk
          echo "asset_path=release_assets/app-debug.apk" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          echo "Creating release tag: $TAG"
          gh release create "$TAG" \
            --title "Debug APK Build #${{ github.run_number }}" \
            --notes "This is an automatically generated debug APK.
            Built by GitHub Actions.
            Run number: ${{ github.run_number }}
            Run attempt: ${{ github.run_attempt }}
            Source commit SHA: ${{ github.sha }}
            
            APK is intended for testing.
            APK is not a Play Store production release.
            APK is signed only with a temporary debug keystore." \
            --target "${{ github.sha }}" \
            --latest \
            "${{ steps.prepare_asset.outputs.asset_path }}#app-debug.apk"

      - name: Report APK download result
        run: |
          if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
            TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "Release published: $TAG"
            gh release view "$TAG"
            
            # Print the download link in the summary
            echo "### DIRECT APK DOWNLOAD" >> $GITHUB_STEP_SUMMARY
            echo "https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The normal Actions artifact named 'app-debug-apk' remains available as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning:: GitHub Release publishing failed."
            echo "The APK build succeeded, and the Actions artifact named 'app-debug-apk' remains available."
          fi
